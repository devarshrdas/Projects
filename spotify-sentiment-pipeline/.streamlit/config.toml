[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0e0e0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#262624"
dataframeBorderColor = "#262624"
linkColor = "#6da7ec"
font = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFont = "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
headingFontWeights = [650, 600, 600, 600, 600, 600]
headingFontSizes = ["2.1rem", "1.35rem", "1.05rem"]
baseRadius = "0.6rem"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
